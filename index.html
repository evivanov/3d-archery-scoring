<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Archery Score Tracker</title>
  <!-- Bulma CSS Framework for modern UI components -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    /* Global Body Styling */
    body {
      font-family: 'Inter', sans-serif; /* Using Inter for a clean, modern font */
      margin: auto; /* Center the content */
      padding: 1.5rem; /* Add padding around the entire page */
      max-width: 600px; /* Max width for better readability on large screens */
      background-color: #f0f2f5; /* Light background color */
      color: #333; /* Default text color */
      line-height: 1.6;
    }

    /* General Container Styling */
    .container {
      background-color: #ffffff; /* White background for the main content area */
      padding: 2rem;
      border-radius: 12px; /* Rounded corners for the main container */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); /* Soft shadow for depth */
    }

    /* Title Styling */
    .title {
      color: #2c3e50; /* Darker title color */
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 2.2rem;
    }

    /* Control Section Styling */
    .controls {
      margin: 1.5rem 0;
      display: flex;
      flex-wrap: wrap; /* Allow items to wrap on smaller screens */
      gap: 0.75rem; /* Space between control elements */
      align-items: center; /* Vertically center items in this flex container */
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee; /* Separator line */
    }

    /* Actions Section Styling (for buttons like export) */
    .actions {
      display: flex;
      justify-content: flex-end; /* Align action buttons to the right */
      gap: 0.75rem;
      margin: 1rem 0;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border-radius: 8px; /* Rounded corners for tables */
      overflow: hidden; /* Ensures rounded corners apply to content */
    }

    th, td {
      border: 1px solid #e0e0e0; /* Lighter borders for cells */
      padding: 0.75rem;
      text-align: center;
      font-size: 0.95rem;
    }

    thead th {
      background-color: #f5f7fa; /* Light header background */
      color: #555;
      font-weight: 600;
    }

    tbody tr:nth-child(even) {
      background: #fdfdfd; /* Very light alternating row color */
    }
    tbody tr:hover {
      background-color: #e6f7ff; /* Light blue on hover for clickable rows */
      cursor: pointer;
    }

    /* Styling for missed entries */
    .missed {
      background: #f8f8f8; /* Slightly greyed out background */
      color: #888;
      font-style: italic;
    }

    /* Grey out the score cell when missed */
    .missed td:nth-child(4) { /* Assuming Score is the 4th column */
      color: #aaa;
    }

    /* Footer row for total score */
    tfoot th {
      background: #e9ecef; /* Darker background for footer */
      color: #333;
      font-weight: 700;
    }

    /* Utility class to hide elements */
    .hidden {
      display: none !important; /* Use !important to override Bulma's display properties */
    }

    /* Animation for preview row */
    .slide-enter {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
    }
    .slide-enter-active {
      max-height: 1000px; /* Sufficiently large value for animation */
    }

    /* Styling for the preview row within the leaderboard */
    .preview-row td {
      padding: 0 !important; /* Remove padding for nested table */
      border: none; /* Remove border for the outer cell */
    }

    /* Styling for the nested table within the preview row */
    .readonly-table {
      margin: 0; /* Remove margin */
      box-shadow: none; /* Remove shadow */
      border-radius: 0; /* Remove border radius */
      width: 100%; /* Ensure it takes full width */
    }
    .readonly-table td, .readonly-table th {
      font-size: 0.85rem; /* Smaller font for nested table */
      padding: 0.4rem; /* Smaller padding */
      border: 1px solid #f0f0f0; /* Lighter border */
    }
    .readonly-table thead th {
      background-color: #eef1f4; /* Slightly different header for nested table */
    }
    .readonly-table tfoot th {
      background-color: #e0e4e8; /* Slightly different footer for nested table */
    }

    /* Custom Modal Styling */
    .modal {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1000; /* Sit on top */
        left: 0;
        top: 0;
        width: 100%; /* Full width */
        height: 100%; /* Full height */
        overflow: auto; /* Enable scroll if needed */
        background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%; /* Could be more responsive */
        max-width: 400px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        text-align: center;
    }

    .modal-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: space-around;
        gap: 10px;
    }

    .modal-buttons .button {
        flex-grow: 1; /* Make buttons take equal width */
    }

    /* Styling for disabled select/input when arrows is 'Miss' or 'Custom' */
    .select.is-disabled select,
    .input.is-disabled { /* Apply to input directly */
      background-color: #e9ecef; /* Light grey background */
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Alignment adjustments for buttons within controls */
    .controls .button {
        margin-top: 0; /* Remove default margin-top from Bulma's .button */
    }
    .controls .field {
        margin-bottom: 0; /* Remove default margin-bottom from Bulma's .field */
    }

    /* Alignment adjustments for form buttons */
    .column .button {
        /* Adjusted margin-top to align with the notes input field */
        margin-top: 2.2rem !important; /* This value is tuned for visual alignment */
    }

    /* Add horizontal scroll to the local score table only on smaller screens */
    .table-container {
        overflow-x: auto;
    }

    /* Hide Notes column on mobile for the leaderboard only */
    @media (max-width: 768px) {
      .hide-on-mobile {
        display: none;
      }
    }
  </style>
  <!-- Firebase SDKs - using compat versions as in your original code -->
  <!-- Note: These are external. If you want a truly single file, their content would need to be inlined. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Your custom environment and scores data -->
  <!-- Note: These are external. If you want a truly single file, their content would need to be inlined. -->
  <script src="env.js"></script>
  <script src="scores.js"></script>
</head>
<body class="p-4">
  <div class="container">
    <h1 class="title is-2">3D Archery Score Tracker</h1>

    <!-- Controls Section: Remote Toggle, Name Input, Export CSV -->
    <div class="controls">
      <label class="checkbox">
        <input type="checkbox" id="remoteToggle"> Use Remote Leaderboard
      </label>
      <div id="nameContainer" class="field has-addons is-flex-grow-1 ml-4 hidden">
        <div class="control">
          <label class="label is-inline-block mr-2 mt-2">Name:</label> <!-- Added label for name input -->
        </div>
        <div class="control is-expanded">
          <input class="input is-rounded" type="text" id="archerName" placeholder="Your Name">
        </div>
      </div>
      <button class="button is-info is-rounded ml-auto" id="exportCSV">Export CSV</button>
    </div>

    <!-- Score Entry Form -->
    <form id="scoreForm">
      <div class="columns is-multiline">
        <!-- Target Select -->
        <div class="column is-one-third">
          <label class="label">Target</label>
          <div class="select is-fullwidth is-rounded">
            <select id="targetSelect"></select>
          </div>
        </div>
        <!-- Arrows Select -->
        <div class="column is-one-third">
          <label class="label">Arrows</label>
          <div class="select is-fullwidth is-rounded">
            <select id="arrowsSelect"></select>
          </div>
        </div>
        <!-- Result Select (Kill/Wound) OR Custom Score Input -->
        <div class="column is-one-third">
          <label class="label">Result</label>
          <div class="select is-fullwidth is-rounded" id="resultSelectWrapper">
            <select id="resultSelect"></select>
          </div>
          <div class="control is-fullwidth hidden" id="customScoreInputWrapper">
            <input class="input is-rounded" type="number" id="customScoreInput" placeholder="Enter Score" min="0" step="1">
          </div>
        </div>
        <!-- Notes Input -->
        <div class="column is-two-thirds">
          <label class="label">Notes</label>
          <input class="input is-rounded" type="text" id="notesInput" placeholder="Add notes (optional)">
        </div>
        <!-- Save Target Button -->
        <div class="column is-one-third">
          <button class="button is-success is-rounded is-fullwidth" type="button" id="addBtn">Save</button>
        </div>
        <!-- Reset Button -->
        <div class="column is-one-third">
          <button class="button is-warning is-rounded is-fullwidth" type="button" id="resetBtn">Reset All</button>
        </div>
        <!-- Show All Targets Toggle -->
        <div class="column is-full">
          <label class="checkbox mt-4">
            <input type="checkbox" id="showAllToggle" checked> Show all <span id="totalTargetsDisplay">25</span> targets (even un-scored)
          </label>
        </div>
      </div>
    </form>

    <!-- Local Score Table -->
    <div class="table-container">
        <table class="table is-striped is-hoverable is-fullwidth score-table">
          <thead>
            <tr>
              <th>#</th> <!-- Changed label to # -->
              <th>Arrows</th>
              <th>Result</th>
              <th>Score</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="scoreBody">
            <!-- Score entries will be dynamically inserted here -->
          </tbody>
          <tfoot>
            <tr>
              <th colspan="3">Total Score</th> <!-- Fixed colspan to span #, Arrows, Result -->
              <th id="totalScore">0</th>
              <th></th> <!-- Empty th for Notes column alignment -->
            </tr>
          </tfoot>
        </table>
    </div>

    <!-- Leaderboard Section -->
    <div id="leaderboardSection" class="hidden"> <!-- Added wrapper div for the whole section -->
      <h2 class="title is-4 mt-6">Global Leaderboard</h2>
      <div class="controls">
        <div class="select is-rounded">
          <select id="monthSelect"></select>
        </div>
        <button class="button is-primary is-rounded ml-auto" id="refreshLeaderboard">Refresh Leaderboard</button>
      </div>
      <div class="table-container">
        <table class="table is-striped is-hoverable is-fullwidth" id="leaderboardTable">
          <thead><tr><th>Name</th><th>Date</th><th class="hide-on-mobile">Total Score</th></tr></thead>
          <tbody id="leaderboardBody">
            <!-- Leaderboard entries will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <p>Are you sure you want to reset all local scores?</p>
      <div class="modal-buttons">
        <button class="button is-danger" id="confirmResetYes">Yes, Reset</button>
        <button class="button is-light" id="confirmResetNo">No, Cancel</button>
      </div>
    </div>
  </div>

  <script>
  // Ensure the DOM is fully loaded before running JavaScript
  document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Element References ---
    const remoteToggle = document.getElementById('remoteToggle');
    const nameContainer = document.getElementById('nameContainer');
    const archerName = document.getElementById('archerName');
    const exportCSV = document.getElementById('exportCSV');
    const targetSelect = document.getElementById('targetSelect');
    const arrowsSelect = document.getElementById('arrowsSelect');
    const resultSelect = document.getElementById('resultSelect');
    const resultSelectWrapper = document.getElementById('resultSelectWrapper'); // Wrapper for disabling
    const customScoreInput = document.getElementById('customScoreInput'); // New custom score input
    const customScoreInputWrapper = document.getElementById('customScoreInputWrapper'); // New custom score input wrapper
    const notesInput = document.getElementById('notesInput');
    const addBtn = document.getElementById('addBtn');
    const resetBtn = document.getElementById('resetBtn');
    const showAllToggle = document.getElementById('showAllToggle');
    const totalTargetsDisplay = document.getElementById('totalTargetsDisplay'); // Element to display total targets
    const scoreBody = document.getElementById('scoreBody');
    const totalScoreEl = document.getElementById('totalScore');
    const leaderboardSection = document.getElementById('leaderboardSection'); // Reference for the whole leaderboard section
    const monthSelect = document.getElementById('monthSelect'); // New month select dropdown
    const refreshLb = document.getElementById('refreshLeaderboard');
    const leaderboardBody = document.getElementById('leaderboardBody'); // Reference for the leaderboard table body
    const scoreForm = document.getElementById('scoreForm'); // Reference to the score form for scrolling

    // Modal elements
    const confirmationModal = document.getElementById('confirmationModal');
    const confirmResetYes = document.getElementById('confirmResetYes');
    const confirmResetNo = document.getElementById('confirmResetNo');

    // --- Application State Variables ---
    // Load entries from local storage or initialize as an empty object
    let entries = JSON.parse(localStorage.getItem('entries') || '{}');
    let db; // Firestore database instance
    let firestoreInitialized = false; // Flag to track Firestore initialization
    let allLeaderboardData = []; // Store all fetched leaderboard data for client-side filtering

    // --- Constants for numerical codes ---
    const MISS_ARROW_STR = '0'; // String representation for 'Miss' in dropdown
    const CUSTOM_ARROW_STR = 'custom'; // String representation for 'Custom' in dropdown
    const KILL_CODE = 1;
    const WOUND_CODE = 2;
    const NO_RESULT_CODE = 0; // For Miss or Custom scores
    // Reverse mapping for displaying result types
    const RESULT_CODES_MAP = { [KILL_CODE]: 'Kill', [WOUND_CODE]: 'Wound', [NO_RESULT_CODE]: '' // For Miss or Custom, no specific result type
    };
    // Get total targets from scores.js, default to 25 if not defined
    const TOTAL_TARGETS = window.scores?.TOTAL_TARGETS || 25;
    totalTargetsDisplay.textContent = TOTAL_TARGETS; // Update display in HTML
    
    // Define a collection name
    const LEADERBOARD_COLLECTION = 'leaderboard_v2'; // Using a new collection name to avoid conflicts

    // --- Utility Functions ---
    /**
     * Capitalizes the first letter of a string and trims whitespace.
     * @param {string} str - The input string.
     * @returns {string} The formatted string.
     */
    function formatName(str) {
      if (!str) return '';
      str = str.trim();
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    /**
     * Checks if the screen width is considered mobile.
     * Corresponds to Bulma's `max-width: 768px` for mobile.
     * @returns {boolean} True if mobile, false otherwise.
     */
    function isMobile() {
      return window.innerWidth <= 768;
    }

    /**
     * Populates the 'Target', 'Arrows', and 'Result' select dropdowns.
     */
    function initSelects() {
      // Populate Target dropdown (1 to TOTAL_TARGETS)
      targetSelect.innerHTML = '<option value="">Select Target...</option>';
      for (let i = 1; i <= TOTAL_TARGETS; i++) {
        targetSelect.add(new Option(i, i));
      }

      // Populate Arrows dropdown
      arrowsSelect.innerHTML = '<option value="">Select Arrows...</option>';
      if (window.scores && (window.scores[KILL_CODE] || window.scores[WOUND_CODE])) {
        const arrowValues = new Set();
        // Iterate through the numerical keys of Kill and Wound scores to get all arrow values
        if (window.scores[KILL_CODE]) {
          Object.keys(window.scores[KILL_CODE]).forEach(k => arrowValues.add(parseInt(k)));
        }
        if (window.scores[WOUND_CODE]) {
          Object.keys(window.scores[WOUND_CODE]).forEach(k => arrowValues.add(parseInt(k)));
        }
        // Add standard arrow options, sorted in ascending order (1, 2, 3)
        Array.from(arrowValues).sort((a,b) => b-a).forEach(val => { // Changed sort order to b-a
          if (val !== 0) { // '0' is handled as 'Miss' explicitly
            arrowsSelect.add(new Option(val.toString(), val.toString()));
          }
        });
        arrowsSelect.add(new Option('Miss', MISS_ARROW_STR)); // Add Miss explicitly
        arrowsSelect.add(new Option('Custom Score', CUSTOM_ARROW_STR)); // Add Custom Score explicitly
      } else {
        console.error("window.scores is not defined or missing numerical keys. Check scores.js.");
        // Fallback options if scores.js isn't loaded correctly or malformed
        arrowsSelect.add(new Option('Miss', MISS_ARROW_STR));
        arrowsSelect.add(new Option('Custom Score', CUSTOM_ARROW_STR));
      }

      // Populate Result dropdown (Kill/Wound)
      resultSelect.innerHTML = '<option value="">Select Result...</option>';
      resultSelect.add(new Option('Kill', KILL_CODE));
      resultSelect.add(new Option('Wound', WOUND_CODE));
    }

    /**
     * Calculates the total score from the `entries` object.
     * @returns {number} The total score.
     */
    function calculateTotalScore() {
      let total = 0;
      for (const target in entries) {
        const entry = entries[target];
        if (entry.resultType === KILL_CODE || entry.resultType === WOUND_CODE) {
          total += window.scores[entry.resultType][entry.arrows];
        } else if (entry.arrows !== MISS_ARROW_STR) {
          // This is a custom score
          total += parseInt(entry.arrows, 10);
        }
      }
      return total;
    }

    /**
     * Saves the current `entries` object to local storage.
     */
    function saveLocal() {
      localStorage.setItem('entries', JSON.stringify(entries));
    }

    /**
     * Loads `entries` from local storage.
     */
    function loadLocal() {
      const storedEntries = localStorage.getItem('entries');
      if (storedEntries) {
        entries = JSON.parse(storedEntries);
      }
    }

    /**
     * Updates the local score table with data from the `entries` object.
     */
    function updateTable() {
      scoreBody.innerHTML = ''; // Clear the table body
      let total = 0;
      let targetsScored = Object.keys(entries).map(Number);
      let allTargets = [];

      for (let i = 1; i <= TOTAL_TARGETS; i++) {
        allTargets.push(i);
      }

      const targetsToDisplay = showAllToggle.checked ? allTargets : targetsScored;

      targetsToDisplay.forEach(target => {
        const entry = entries[target] || {};
        const isMissed = entry.arrows === MISS_ARROW_STR;
        const resultType = entry.resultType;
        let score = '';

        if (entry.arrows) {
          if (isMissed) {
            score = 0;
          } else if (resultType === KILL_CODE || resultType === WOUND_CODE) {
            score = window.scores[resultType][entry.arrows];
          } else {
            // Custom score
            score = entry.arrows;
          }
        }
        total += parseInt(score || 0, 10);

        const row = document.createElement('tr');
        if (!entry.arrows) {
            row.classList.add('missed');
        }
        
        row.dataset.target = target;
        row.dataset.docId = entry.docId || ''; // Add docId to the row for later use
        
        row.innerHTML = `
          <td>${target}</td>
          <td>${isMissed ? 'Miss' : (entry.arrows || '')}</td>
          <td>${RESULT_CODES_MAP[resultType] || ''}</td>
          <td>${score}</td>
          <td>${entry.notes || ''}</td>
        `;
        scoreBody.appendChild(row);
      });

      totalScoreEl.textContent = total;
    }

    /**
     * Disables or enables the result select and custom score input based on the arrows select value.
     */
    function handleArrowsSelectChange() {
      const selectedValue = arrowsSelect.value;
      const isMissOrCustom = selectedValue === MISS_ARROW_STR || selectedValue === CUSTOM_ARROW_STR;

      if (selectedValue === CUSTOM_ARROW_STR) {
        resultSelectWrapper.classList.add('hidden');
        customScoreInputWrapper.classList.remove('hidden');
      } else {
        resultSelectWrapper.classList.remove('hidden');
        customScoreInputWrapper.classList.add('hidden');
      }

      if (isMissOrCustom) {
        // Disable resultSelect if Miss or Custom is selected
        resultSelect.disabled = true;
      } else {
        // Enable resultSelect otherwise
        resultSelect.disabled = false;
      }
    }

    /**
     * Toggles the visibility of the name input field and the leaderboard section.
     * @param {boolean} isRemote - Whether to show remote controls.
     */
    function toggleRemote(isRemote) {
      if (isRemote) {
        nameContainer.classList.remove('hidden');
        leaderboardSection.classList.remove('hidden');
        if (!firestoreInitialized) {
          initFirestore();
        } else {
          fetchLeaderboard();
        }
      } else {
        nameContainer.classList.add('hidden');
        leaderboardSection.classList.add('hidden');
      }
    }

    /**
     * Initializes Firestore.
     */
    function initFirestore() {
        if (!firestoreInitialized && window._env_ && window.firebase) {
            firebase.initializeApp(window._env_);
            db = firebase.firestore();
            firestoreInitialized = true;
            console.log("Firestore initialized.");
            fetchLeaderboard(); // Initial fetch
        } else if (!window.firebase) {
            console.error("Firebase SDK not loaded. Check script tags.");
        } else if (!window._env_) {
            console.error("Environment variables for Firebase not found. Check env.js.");
        }
    }

    /**
     * Fetches all leaderboard data and displays it.
     */
    function fetchLeaderboard() {
      if (!db) {
        console.error("Firestore not initialized.");
        return;
      }

      // Use a timestamp to query for documents in the selected month
      // This is a simple approach. A more robust solution might use a dedicated 'month' field
      // to avoid complex date range queries, which can be slow and require composite indexes.
      const selectedMonth = monthSelect.value;
      let monthStartDate, monthEndDate;
      if (selectedMonth) {
          const [year, month] = selectedMonth.split('-');
          monthStartDate = new Date(year, parseInt(month) - 1, 1);
          monthEndDate = new Date(year, parseInt(month), 0);
          monthEndDate.setHours(23, 59, 59, 999);
      }
      
      const leaderboardRef = db.collection(LEADERBOARD_COLLECTION);
      
      let queryRef = leaderboardRef;

      // Note: Ordering by 'totalScore' on the server-side can be problematic without an index.
      // We will fetch all data and sort it client-side to avoid this issue.
      
      // Clear previous snapshot listener if one exists
      if (window.leaderboardUnsubscribe) {
        window.leaderboardUnsubscribe();
      }

      window.leaderboardUnsubscribe = queryRef.onSnapshot(snapshot => {
        allLeaderboardData = [];
        snapshot.forEach(doc => {
          allLeaderboardData.push({ id: doc.id, ...doc.data() });
        });
        
        // Client-side filtering and sorting
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const currentMonthString = `${year}-${String(month).padStart(2, '0')}`;
        
        const filteredData = allLeaderboardData.filter(d => {
            const date = new Date(d.date);
            const entryMonthString = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            // If no month is selected, show current month by default.
            return selectedMonth ? entryMonthString === selectedMonth : entryMonthString === currentMonthString;
        });
        
        // Sort by totalScore descending, then by date descending
        filteredData.sort((a, b) => {
          if (b.totalScore !== a.totalScore) {
            return b.totalScore - a.totalScore;
          }
          return new Date(b.date) - new Date(a.date);
        });

        renderLeaderboard(filteredData);
      }, err => {
        console.error("Error fetching leaderboard: ", err);
      });
    }
    
    function renderLeaderboard(data) {
        leaderboardBody.innerHTML = '';
        if (data.length === 0) {
            leaderboardBody.innerHTML = '<tr><td colspan="3">No scores available for this month.</td></tr>';
            return;
        }

        data.forEach(entry => {
            const date = new Date(entry.date);
            const dateString = date.toLocaleDateString();
            const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const row = document.createElement('tr');
            row.dataset.docId = entry.id; // Store Firestore doc ID
            row.innerHTML = `
                <td>${entry.name}</td>
                <td>${dateString} <br> ${timeString}</td>
                <td>${entry.totalScore}</td>
            `;
            leaderboardBody.appendChild(row);
        });
    }

    /**
     * Populates the month select dropdown with options for the current and previous 12 months.
     */
    function populateMonthSelect() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      
      monthSelect.innerHTML = '';

      // Add a 'Current Month' option
      const currentMonthOption = document.createElement('option');
      currentMonthOption.value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
      currentMonthOption.textContent = `Current Month (${months[currentMonth]} ${currentYear})`;
      monthSelect.appendChild(currentMonthOption);

      // Add previous months
      for (let i = 1; i <= 12; i++) {
        const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const year = date.getFullYear();
        const month = date.getMonth();
        const value = `${year}-${String(month + 1).padStart(2, '0')}`;
        const text = `${months[month]} ${year}`;
        const option = new Option(text, value);
        monthSelect.add(option);
      }
    }
    
    /**
     * Loads a specific entry from the leaderboard into the local score tracker.
     * @param {string} docId - The Firestore document ID to load.
     */
    async function loadFromRemote(docId) {
        if (!db) {
            console.error("Firestore not initialized.");
            return;
        }
        try {
            const doc = await db.collection(LEADERBOARD_COLLECTION).doc(docId).get();
            if (doc.exists) {
                const data = doc.data();
                entries = data.entries;
                // Since this is a new remote entry, we save it locally for now.
                // You could add a docId field to the local entries if you want to track it.
                saveLocal();
                updateTable();
                
                // Set the archer's name input field
                archerName.value = data.name;
                
                // Scroll to the local score table
                scoreBody.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                console.error("Document not found.");
            }
        } catch (e) {
            console.error("Error loading document: ", e);
        }
    }

    // --- Event Listeners ---
    remoteToggle.addEventListener('change', () => toggleRemote(remoteToggle.checked));
    
    monthSelect.addEventListener('change', () => fetchLeaderboard());
    
    refreshLb.addEventListener('click', () => fetchLeaderboard());

    addBtn.addEventListener('click', async () => {
      const t = targetSelect.value,
        a = arrowsSelect.value;
      if (!t || !a) return;

      const name = formatName(archerName.value);
      if (remoteToggle.checked && !name) {
          alert("Please enter your name to save to the leaderboard.");
          return;
      }
      
      const selectedResult = resultSelect.disabled ? NO_RESULT_CODE : parseInt(resultSelect.value);
      const score = a === CUSTOM_ARROW_STR ? parseInt(customScoreInput.value) : parseInt(a);

      entries[t] = {
        arrows: a === CUSTOM_ARROW_STR ? score : a,
        resultType: selectedResult,
        notes: notesInput.value,
      };
      
      saveLocal();
      updateTable();

      // Save to Firestore with a new unique document ID
      if (remoteToggle.checked && firestoreInitialized) {
        try {
          const totalScore = calculateTotalScore();
          const newDoc = {
            name: name,
            totalScore: totalScore,
            date: new Date().toISOString(),
            entries: entries,
          };
          await db.collection(LEADERBOARD_COLLECTION).add(newDoc);
          console.log("Score saved to leaderboard.");
        } catch (e) {
          console.error("Error saving to leaderboard: ", e);
        }
      }
    });

    resetBtn.addEventListener('click', () => {
      confirmationModal.style.display = 'flex';
    });

    confirmResetYes.addEventListener('click', () => {
      localStorage.removeItem('entries');
      entries = {};
      updateTable();
      confirmationModal.style.display = 'none';
      targetSelect.value = '';
      arrowsSelect.value = '';
      resultSelect.value = '';
      notesInput.value = '';
      customScoreInput.value = '';
    });

    confirmResetNo.addEventListener('click', () => {
      confirmationModal.style.display = 'none';
    });

    showAllToggle.addEventListener('change', updateTable);

    targetSelect.addEventListener('change', () => {
      const selectedTarget = targetSelect.value;
      if (!selectedTarget) {
        // If no target is selected, clear other fields
        arrowsSelect.value = '';
        resultSelect.value = '';
        notesInput.value = '';
        customScoreInput.value = '';
        handleArrowsSelectChange();
        return;
      }
      
      const entryData = entries[selectedTarget];
      if (entryData) {
        if (entryData.arrows && (entryData.resultType === NO_RESULT_CODE) && (entryData.arrows !== MISS_ARROW_STR)) {
            // This is a custom score
            arrowsSelect.value = CUSTOM_ARROW_STR;
            customScoreInput.value = entryData.arrows;
        } else if (entryData.arrows === MISS_ARROW_STR) { // Miss
            arrowsSelect.value = MISS_ARROW_STR;
        } else {
            arrowsSelect.value = entryData.arrows.toString(); // Standard 1, 2, 3
        }

        resultSelect.value = entryData.resultType;
        notesInput.value = entryData.notes;
      } else {
        // If no data for this target, clear other fields
        arrowsSelect.value = '';
        resultSelect.value = '';
        notesInput.value = '';
        customScoreInput.value = ''; // Clear custom score input
      }

      // Ensure the correct result input (select or custom text) is shown/hidden
      handleArrowsSelectChange();

      // Scroll to the score form
      scoreForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    arrowsSelect.addEventListener('change', handleArrowsSelectChange);
    
    // Add event listener to the leaderboard table body for loading a specific entry
    leaderboardBody.addEventListener('click', (e) => {
        const row = e.target.closest('tr');
        if (row && row.dataset.docId) {
            loadFromRemote(row.dataset.docId);
        }
    });

    // --- Initial Setup on Page Load ---
    initSelects(); // Populate dropdowns
    loadLocal(); // Load saved preferences and apply them
    updateTable(); // Display any existing local scores
    populateMonthSelect(); // Populate the month dropdown

    // Initialize the state of resultSelect/customScoreInput based on current arrowsSelect value
    // This handles cases where 'Miss' or 'Custom' might be pre-selected on load (e.g., from local storage)
    handleArrowsSelectChange();

    // Listen for window resize to adjust table columns dynamically
    window.addEventListener('resize', updateTable);
  });
  </script>
</body>
</html>
